<table class="table">
	<thead>
		<tr>
			<th scope="col">Id</th>
			<th scope="col">Cantidad mínima</th>
			<th scope="col">Cantidad máxima</th>
			<th scope="col">Valor</th>
			<th scope="col">Acciones</th>
		</tr>
	</thead>
	<tbody>
		@for (item of amounts; track $index) {
			<tr>
				<td>{{ item.id }}</td>
				<td>{{ item.min }}</td>
				<td>{{ item.max }}</td>
				<td>{{item.amount}}</td>
				<td>
					<button type="button" class="btn btn-primary" data-bs-toggle="modal" attr.data-bs-target="#{{ modal.name }}Modal" (click)="fillForm($index)">Modificar</button>
				</td>
			</tr>
		}
	</tbody>
</table>
<ng-template #saleCommissionForm>
	<form [formGroup]="form" (submit)="submitForm()">
        <div class="mb-4">
			<div>
				<label class="form-label required" for="amount">Monto</label>
				<input type="text" id="amount" class="form-control" formControlName="amount" required>
			</div>
		</div>
		<div class="mb-4">
			<div>
				<button type="submit" id="save" class="btn btn-primary">Guardar</button>
				<button id="{{ modal.name }}FormReset" class="btn btn-secondary" (click)="resetForm()">Limpiar</button>
			</div>
		</div>
	</form>
</ng-template>
<app-modal [name]="modal.name" [title]="modal.title" [body]="saleCommissionForm"/>
